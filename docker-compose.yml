services:
  postgres:
    image: postgres:16-alpine
    container_name: styleai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: styleAI
      POSTGRES_DB: postgres

    ports:
      - "5433:5432"

    volumes:
      - styleai_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  styleai_postgres_data: